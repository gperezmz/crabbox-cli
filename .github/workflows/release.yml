name: Release CLI
run-name: Release ${{ inputs.source_ref || 'gcp-desktop' }}

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: Release version; defaults to <crabbox version>-gcp.<UTC stamp>
        required: false
        type: string
      source_repo:
        description: Crabbox repository to build
        required: false
        default: gperezmz/crabbox
        type: string
      source_ref:
        description: Branch, tag or commit to build
        required: false
        default: gcp-desktop
        type: string
      force:
        description: Release even when the source commit is already published
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: crabbox-cli-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the source commit and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      skip: ${{ steps.source.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repo || 'gperezmz/crabbox' }}
          ref: ${{ inputs.source_ref || 'gcp-desktop' }}
          path: src
      - id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(git -C src rev-parse HEAD)"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            base="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' src/worker/package.json | head -1)"
            version="${base}-gcp.$(date -u +%Y%m%d%H%M)"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

          published="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')"
          notes="$(gh release view "$published" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)"
          if [[ "${{ inputs.force }}" != "true" && "$notes" == *"$sha"* ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "::notice::$sha is already published as $published"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        target:
          - darwin/amd64
          - darwin/arm64
          - linux/amd64
          - linux/arm64
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repo || 'gperezmz/crabbox' }}
          ref: ${{ needs.prepare.outputs.sha }}
          path: src
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Build
        env:
          CRABBOX_SRC: ${{ github.workspace }}/src
          CRABBOX_TARGETS: ${{ matrix.target }}
        run: scripts/build-cli.sh "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ strategy.job-index }}
          path: dist/crabbox_*
          retention-days: 1

  publish:
    name: Publish the release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && shasum -a 256 ./crabbox_* >checksums.txt && ls -la
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REPO: ${{ inputs.source_repo || 'gperezmz/crabbox' }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "crabbox v$VERSION" \
            --notes "Build of $SOURCE_REPO@$SOURCE_SHA.

          Unofficial build. Not affiliated with or endorsed by the Crabbox project; Crabbox is MIT licensed,
          copyright openclaw, and each archive ships that licence."
